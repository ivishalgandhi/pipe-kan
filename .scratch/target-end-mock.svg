<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" style="background:#ffffff; font-family: Inter, ui-sans-serif, system-ui, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <text x="30" y="30" font-size="16" font-weight="600" fill="#111">PipeKan cards with Target End Date (like Linear)</text>

  <!-- Card 1: future target end -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="360" height="110" rx="9" fill="#fafafa" stroke="#e5e5e5" filter="url(#shadow)"/>
    <text x="16" y="24" font-size="13" font-weight="500" fill="#737373" font-family="monospace">DEMO-3</text>
    <text x="320" y="24" font-size="12" font-weight="500" fill="#737373">8d</text>
    <text x="16" y="52" font-size="15" font-weight="500" fill="#171717">Drag a Card to Move</text>

    <!-- Priority pill -->
    <rect x="16" y="72" width="42" height="22" rx="11" fill="#fef2f2" stroke="#fecaca"/>
    <text x="28" y="87" font-size="12" font-weight="600" fill="#ef4444">High</text>

    <!-- Labels -->
    <rect x="64" y="72" width="58" height="22" rx="11" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="75" y="87" font-size="12" fill="#737373">kanban</text>
    <rect x="128" y="72" width="72" height="22" rx="11" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="139" y="87" font-size="12" fill="#737373">write-back</text>

    <!-- Target end (future, muted) -->
    <text x="280" y="87" font-size="12" font-weight="600" fill="#737373" font-family="monospace">4d</text>
    <!-- Due date -->
    <text x="310" y="87" font-size="12" fill="#737373">Aug 25, 2026</text>
    <!-- Assignee avatar -->
    <circle cx="340" cy="83" r="10" fill="#e5e5e5"/>
    <text x="336" y="87" font-size="11" font-weight="600" fill="#525252">P</text>

    <text x="16" y="104" font-size="11" fill="#a3a3a3">Created age shown top-right • Target end shown bottom-right</text>
  </g>

  <!-- Card 2: past target end (red) -->
  <g transform="translate(410, 60)">
    <rect x="0" y="0" width="360" height="110" rx="9" fill="#fafafa" stroke="#e5e5e5" filter="url(#shadow)"/>
    <text x="16" y="24" font-size="13" font-weight="500" fill="#737373" font-family="monospace">DEMO-5</text>
    <text x="320" y="24" font-size="12" font-weight="500" fill="#737373">20d</text>
    <text x="16" y="52" font-size="15" font-weight="500" fill="#171717">Already shipped</text>

    <rect x="16" y="72" width="38" height="22" rx="11" fill="#fafafa" stroke="#e5e5e5"/>
    <text x="26" y="87" font-size="12" font-weight="600" fill="#737373">Low</text>

    <!-- Past target end in red -->
    <text x="280" y="87" font-size="12" font-weight="700" fill="#dc2626" font-family="monospace">4d</text>
    <text x="310" y="87" font-size="12" fill="#737373">Sep 20, 2026</text>
    <circle cx="340" cy="83" r="10" fill="#e5e5e5"/>
    <text x="336" y="87" font-size="11" font-weight="600" fill="#525252">P</text>
  </g>

  <!-- Toggle dropdown mock -->
  <g transform="translate(30, 200)">
    <rect x="0" y="0" width="280" height="120" rx="8" fill="#ffffff" stroke="#e5e5e5" filter="url(#shadow)"/>
    <text x="14" y="22" font-size="13" font-weight="600" fill="#171717">Display properties</text>
    <!-- Toggle rows -->
    <g font-size="12" fill="#171717">
      <text x="14" y="48">Age (created)</text>
      <rect x="230" y="38" width="36" height="18" rx="9" fill="#22c55e"/>
      <circle cx="256" cy="47" r="7" fill="#ffffff"/>

      <text x="14" y="72">Target end</text>
      <rect x="230" y="62" width="36" height="18" rx="9" fill="#22c55e"/>
      <circle cx="256" cy="71" r="7" fill="#ffffff"/>

      <text x="14" y="96">Due date</text>
      <rect x="230" y="86" width="36" height="18" rx="9" fill="#e5e5e5"/>
      <circle cx="238" cy="95" r="7" fill="#ffffff"/>
    </g>
  </g>
</svg>
